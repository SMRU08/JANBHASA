<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JANBHASHA Parler-TTS Runner</title>
</head>
<body>
<script type="module">
/**
 * JANBHASHA Indic Parler-TTS WebView Runner
 * 
 * Runs naklitechie/indic-parler-tts-ONNX (FP16) via onnxruntime-web.
 * Model files served from local device storage via file:// URI.
 * Communicates results back to Kotlin via AndroidTtsBridge.
 * 
 * Pipeline:
 *   text + speaker_description
 *     -> text_encoder_fp16.onnx (prompt encoder)
 *     -> decoder_model_fp16.onnx (first token)
 *     -> decoder_with_past_model_fp16.onnx (subsequent tokens, KV cache)
 *     -> apply_delay_pattern_mask (codebook interleaving)
 *     -> DAC vocoder (onnx-community/dac_44khz-ONNX) -> 44.1kHz PCM
 *     -> WAV encode -> Base64 -> AndroidTtsBridge.onAudioReady()
 */

// Get model base path from URL param
const params = new URLSearchParams(window.location.search);
const MODEL_BASE = params.get('modelBase') || '';

AndroidTtsBridge.onLog('Parler-TTS runner starting. Model base: ' + MODEL_BASE);

// Dynamically load onnxruntime-web from CDN (requires internet on first load)
// For full offline: bundle this JS into assets/
async function loadOrt() {
  return new Promise((resolve, reject) => {
    const script = document.createElement('script');
    script.src = 'https://cdn.jsdelivr.net/npm/onnxruntime-web@1.20.1/dist/ort.min.js';
    script.onload = resolve;
    script.onerror = reject;
    document.head.appendChild(script);
  });
}

// ── Session cache ──────────────────────────────────────────────────────────
let textEncoderSession = null;
let decoderSession = null;
let decoderWithPastSession = null;
let isModelReady = false;

// ── Tokenizer (simple SentencePiece-based using tokenizer.json) ───────────
let tokenizer = null;

async function loadTokenizer() {
  const tokenizerPath = 'file://' + MODEL_BASE + '/tokenizer.json';
  AndroidTtsBridge.onLog('Loading tokenizer from: ' + tokenizerPath);
  
  // Try fetching from file:// URI
  let tokenizerData = null;
  try {
    const resp = await fetch(tokenizerPath);
    tokenizerData = await resp.json();
  } catch(e) {
    AndroidTtsBridge.onLog('Tokenizer fetch failed: ' + e.message + ' - trying fallback tokenizer');
    // Minimal fallback: character-level tokenizer as last resort
    tokenizer = { 
      encode: (text) => {
        // Very basic UTF-8 byte encoding for fallback
        return new TextEncoder().encode(text);
      }
    };
    return;
  }
  
  // Build vocab map from tokenizer.json
  const vocab = tokenizerData.model?.vocab || {};
  const encodeMap = {};
  for (const [token, id] of Object.entries(vocab)) {
    encodeMap[token] = id;
  }
  
  tokenizer = {
    vocab: encodeMap,
    encode: function(text) {
      // Simplified BPE tokenization: exact match first, then character fallback
      const ids = [1]; // BOS
      for (let i = 0; i < text.length; i++) {
        const char = text[i];
        if (encodeMap[char] !== undefined) {
          ids.push(encodeMap[char]);
        } else {
          // Try UTF-8 byte fallback
          const bytes = new TextEncoder().encode(char);
          for (const byte of bytes) {
            const byteToken = '<0x' + byte.toString(16).toUpperCase().padStart(2, '0') + '>';
            if (encodeMap[byteToken] !== undefined) {
              ids.push(encodeMap[byteToken]);
            }
          }
        }
      }
      ids.push(2); // EOS
      return ids;
    }
  };
  AndroidTtsBridge.onLog('Tokenizer loaded: ' + Object.keys(encodeMap).length + ' tokens');
}

// ── Load ONNX sessions ────────────────────────────────────────────────────
async function loadModels() {
  AndroidTtsBridge.onLog('Loading ONNX sessions (FP16)...');
  
  const opts = {
    executionProviders: ['wasm'],
    graphOptimizationLevel: 'all'
  };
  
  const encoderPath = 'file://' + MODEL_BASE + '/text_encoder_fp16.onnx';
  const decoderPath = 'file://' + MODEL_BASE + '/decoder_model_fp16.onnx';
  const decoderPastPath = 'file://' + MODEL_BASE + '/decoder_with_past_model_fp16.onnx';
  
  AndroidTtsBridge.onLog('Loading text encoder...');
  textEncoderSession = await ort.InferenceSession.create(encoderPath, opts);
  AndroidTtsBridge.onLog('Text encoder loaded');
  
  AndroidTtsBridge.onLog('Loading decoder...');
  decoderSession = await ort.InferenceSession.create(decoderPath, opts);
  AndroidTtsBridge.onLog('Decoder loaded');
  
  AndroidTtsBridge.onLog('Loading decoder-with-past...');
  decoderWithPastSession = await ort.InferenceSession.create(decoderPastPath, opts);
  AndroidTtsBridge.onLog('Decoder-with-past loaded');
  
  isModelReady = true;
  AndroidTtsBridge.onReady();
}

// ── apply_delay_pattern_mask (Parler-TTS codebook delay logic) ────────────
function applyDelayPatternMask(inputIds, paddingTokenId, numCodebooks = 9, delay = 1) {
  const seqLen = inputIds.length / numCodebooks;
  const output = new Int32Array(inputIds.length);
  
  for (let cb = 0; cb < numCodebooks; cb++) {
    const cbDelay = cb * delay;
    for (let t = 0; t < seqLen; t++) {
      const srcT = t - cbDelay;
      const dstIdx = cb * seqLen + t;
      if (srcT < 0 || srcT >= seqLen) {
        output[dstIdx] = paddingTokenId;
      } else {
        output[dstIdx] = inputIds[cb * seqLen + srcT];
      }
    }
  }
  return output;
}

// ── WAV encoder ───────────────────────────────────────────────────────────
function encodeWav(pcmFloat32, sampleRate) {
  const numSamples = pcmFloat32.length;
  const numChannels = 1;
  const bitsPerSample = 16;
  const byteRate = sampleRate * numChannels * (bitsPerSample / 8);
  const blockAlign = numChannels * (bitsPerSample / 8);
  const dataSize = numSamples * 2;
  const buffer = new ArrayBuffer(44 + dataSize);
  const view = new DataView(buffer);
  
  // RIFF header
  const writeStr = (off, str) => { for (let i = 0; i < str.length; i++) view.setUint8(off + i, str.charCodeAt(i)); };
  writeStr(0, 'RIFF');
  view.setUint32(4, 36 + dataSize, true);
  writeStr(8, 'WAVE');
  writeStr(12, 'fmt ');
  view.setUint32(16, 16, true);
  view.setUint16(20, 1, true);  // PCM
  view.setUint16(22, numChannels, true);
  view.setUint32(24, sampleRate, true);
  view.setUint32(28, byteRate, true);
  view.setUint16(32, blockAlign, true);
  view.setUint16(34, bitsPerSample, true);
  writeStr(36, 'data');
  view.setUint32(40, dataSize, true);
  
  // PCM samples (float32 -> int16)
  let off = 44;
  for (let i = 0; i < numSamples; i++) {
    const s = Math.max(-1, Math.min(1, pcmFloat32[i]));
    view.setInt16(off, s < 0 ? s * 32768 : s * 32767, true);
    off += 2;
  }
  
  return new Uint8Array(buffer);
}

// ── Base64 encode ─────────────────────────────────────────────────────────
function uint8ToBase64(bytes) {
  let binary = '';
  for (let i = 0; i < bytes.length; i++) binary += String.fromCharCode(bytes[i]);
  return btoa(binary);
}

// ── Main synthesis function ───────────────────────────────────────────────
window.synthesize = async function(text, speakerDescription) {
  AndroidTtsBridge.onLog('synthesize() called: ' + text.substring(0, 40));
  
  if (!isModelReady) {
    AndroidTtsBridge.onError('Model not ready');
    return;
  }
  
  try {
    // 1. Tokenize text and speaker description
    const textIds = tokenizer.encode(text);
    const descIds = tokenizer.encode(speakerDescription);
    
    const textIdsTensor = new ort.Tensor('int64', BigInt64Array.from(textIds.map(BigInt)), [1, textIds.length]);
    const descIdsTensor = new ort.Tensor('int64', BigInt64Array.from(descIds.map(BigInt)), [1, descIds.length]);
    
    // 2. Run text encoder
    AndroidTtsBridge.onLog('Running text encoder...');
    const encOutput = await textEncoderSession.run({
      input_ids: descIdsTensor,
      attention_mask: new ort.Tensor('int64', BigInt64Array.from(new Array(descIds.length).fill(1n)), [1, descIds.length])
    });
    const encoderHiddenStates = encOutput.last_hidden_state || encOutput[Object.keys(encOutput)[0]];
    
    // 3. Autoregressive decoder loop
    AndroidTtsBridge.onLog('Running autoregressive decoder...');
    const maxNewTokens = 400; // ~5-6 seconds of audio at 44.1kHz / 86 tokens/sec
    const numCodebooks = 9;
    const PADDING_ID = 1024; // Parler-TTS padding token
    
    // Start tokens: BOS for each codebook
    let decoderInputIds = new ort.Tensor(
      'int64',
      BigInt64Array.from(new Array(numCodebooks).fill(1025n)), // BOS = 1025
      [1, numCodebooks, 1]
    );
    
    let pastKeyValues = null;
    const generatedIds = [];
    
    for (let step = 0; step < maxNewTokens; step++) {
      let inputs;
      let session;
      
      if (step === 0 || pastKeyValues === null) {
        // First step: use decoder_model (no past)
        session = decoderSession;
        inputs = {
          input_ids: decoderInputIds,
          encoder_hidden_states: encoderHiddenStates,
          encoder_attention_mask: new ort.Tensor('int64', 
            BigInt64Array.from(new Array(descIds.length).fill(1n)), 
            [1, descIds.length])
        };
      } else {
        // Subsequent steps: use decoder_with_past
        session = decoderWithPastSession;
        inputs = {
          input_ids: decoderInputIds,
          encoder_hidden_states: encoderHiddenStates,
          encoder_attention_mask: new ort.Tensor('int64',
            BigInt64Array.from(new Array(descIds.length).fill(1n)),
            [1, descIds.length]),
          ...pastKeyValues
        };
      }
      
      const output = await session.run(inputs);
      
      // Greedy decode: argmax per codebook
      const logits = output.logits;
      const [batchSize, numCb, seqLen, vocabSize] = logits.dims;
      const newTokens = [];
      
      for (let cb = 0; cb < numCodebooks; cb++) {
        const offset = (cb * seqLen + seqLen - 1) * vocabSize;
        let maxVal = -Infinity, maxIdx = 0;
        for (let v = 0; v < vocabSize; v++) {
          if (logits.data[offset + v] > maxVal) {
            maxVal = logits.data[offset + v];
            maxIdx = v;
          }
        }
        newTokens.push(maxIdx);
      }
      
      // Check EOS (1026) on any codebook
      if (newTokens.some(t => t === 1026)) break;
      
      generatedIds.push(...newTokens);
      
      // Update past KV
      pastKeyValues = {};
      for (const key of Object.keys(output)) {
        if (key.startsWith('present')) {
          pastKeyValues[key.replace('present', 'past_key_values')] = output[key];
        }
      }
      
      // Update input for next step (shape [1, numCodebooks, 1])
      decoderInputIds = new ort.Tensor(
        'int64',
        BigInt64Array.from(newTokens.map(BigInt)),
        [1, numCodebooks, 1]
      );
      
      if (step % 50 === 0) AndroidTtsBridge.onLog('Decoding step: ' + step + '/' + maxNewTokens);
    }
    
    AndroidTtsBridge.onLog('Generated ' + generatedIds.length + ' tokens (' + (generatedIds.length / numCodebooks) + ' steps)');
    
    // 4. Apply delay pattern mask
    const maskedIds = applyDelayPatternMask(generatedIds, PADDING_ID, numCodebooks, 1);
    
    // 5. DAC Vocoder — simplified: use linear PCM synthesis as fallback
    // Full DAC vocoder would require onnx-community/dac_44khz-ONNX
    // Implementing simplified version: map code tokens -> sine waves per codebook
    // THIS IS A PLACEHOLDER — real DAC vocoder needed for final quality
    const seqLen = generatedIds.length / numCodebooks;
    const sampleRate = 44100;
    const hopSize = 512; // DAC typical hop size
    const pcmSamples = new Float32Array(seqLen * hopSize);
    
    // In the real implementation, DAC would decode the RVQ codes to waveform.
    // For now, generate silence with proper length to prove pipeline works.
    // TODO: integrate onnx-community/dac_44khz-ONNX
    for (let i = 0; i < pcmSamples.length; i++) {
      pcmSamples[i] = 0.0;
    }
    
    AndroidTtsBridge.onLog('PCM generated: ' + pcmSamples.length + ' samples (' + (pcmSamples.length / sampleRate).toFixed(2) + 's)');
    
    // 6. Encode to WAV and send back to Kotlin
    const wavBytes = encodeWav(pcmSamples, sampleRate);
    const base64Wav = uint8ToBase64(wavBytes);
    AndroidTtsBridge.onAudioReady(base64Wav);
    
  } catch (e) {
    AndroidTtsBridge.onError('Synthesis error: ' + e.message + '\n' + e.stack);
  }
};

// ── Startup ───────────────────────────────────────────────────────────────
(async () => {
  try {
    AndroidTtsBridge.onLog('Loading onnxruntime-web...');
    await loadOrt();
    AndroidTtsBridge.onLog('onnxruntime-web loaded');
    await loadTokenizer();
    await loadModels();
  } catch(e) {
    AndroidTtsBridge.onError('Init failed: ' + e.message);
  }
})();
</script>
</body>
</html>
